<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Donation | StudySets</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Monda:wght@400;700&display=swap"
            rel="stylesheet"
        />
        <link href="/assets/colors.css" rel="stylesheet" />
        <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Monda", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }
            nav {
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
                padding: 0 24px;
                display: flex;
                align-items: center;
                gap: 4px;
                height: 56px;
            }
            nav .nav-link {
                text-decoration: none;
                color: var(--text-dim);
                font-family: "Monda", sans-serif;
                font-size: 13px;
                padding: 8px 14px;
                border-radius: 8px;
                transition: all 0.15s;
            }
            nav .nav-link:hover {
                color: var(--text);
                background: var(--bg3);
            }
            nav .nav-link.active {
                color: var(--accent);
                background: var(--accent-dim);
            }
            main {
                max-width: 900px;
                margin: 0 auto;
                padding: 42px 24px;
                width: 100%;
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 16px;
                align-items: center;
            }
            h1 {
                font-size: 30px;
            }
            p {
                color: var(--text-dim);
            }
        </style>
    </head>
    <body>
        <nav>
            <a class="nav-link" href="/index.html">Home</a>
            <a class="nav-link active" href="/donation/index.html">Donation</a>
            <a class="nav-link" href="/sponsors/index.html">Sponsors</a>
        </nav>
        <main>
            <h1>Support Cyberthon</h1>
            <p>Your contribution helps make the event possible.</p>
            <iframe
                src="https://hcb.hackclub.com/donations/start/cyberthon"
                style="border: none"
                name="donateFrame"
                scrolling="yes"
                frameborder="0"
                marginheight="0px"
                marginwidth="0px"
                height="512px"
                width="512px"
                allowfullscreen
            ></iframe>
        </main>
    </body>
</html>
